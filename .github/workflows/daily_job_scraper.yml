name: Daily Senior QA Job Scraper

on:
  schedule:
    # Runs automatically every day at 13:00 UTC (8:00 AM CST)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    env:
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Execute Scraper Script
        run: python dailyjob_finder.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_remote_qa_jobs.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update daily senior remote QA listings [skip ci]" && git push)
